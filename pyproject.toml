[project]
name = "context-dev"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "dify-plugin>=0.9.0,<0.10.0",
    "requests>=2.32.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "PyYAML>=6.0.0,<7.0.0",
    "pytest>=8.0.0,<9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls the production Context.dev API",
]
