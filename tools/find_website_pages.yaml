identity:
  name: find_website_pages
  author: aadithyanr
  label:
    en_US: Find Website Pages
description:
  human:
    en_US: Discover pages from a website sitemap and optionally rank them by topic.
  llm: Discover public URLs from a website. Use the optional search phrase to return pages most relevant to a topic.
parameters:
  - name: domain
    type: string
    required: true
    form: llm
    label:
      en_US: Domain
    human_description:
      en_US: The website domain to inspect.
    llm_description: The website domain, such as example.com.
  - name: search
    type: string
    required: false
    form: llm
    label:
      en_US: Search Topic
    human_description:
      en_US: Optional phrase used to rank matching website pages.
    llm_description: A topic or phrase used to find the most relevant pages on the website.
  - name: max_links
    type: number
    required: false
    form: form
    default: 100
    min: 1
    max: 1000
    label:
      en_US: Maximum Links
    human_description:
      en_US: Maximum number of URLs to return.
  - name: sitemap_url
    type: string
    required: false
    form: form
    label:
      en_US: Sitemap URL
    human_description:
      en_US: Optional explicit sitemap URL to inspect.
  - name: url_regex
    type: string
    required: false
    form: form
    label:
      en_US: URL Pattern
    human_description:
      en_US: Regular expression that returned URLs must match.
extra:
  python:
    source: tools/find_website_pages.py
