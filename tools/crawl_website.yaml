identity:
  name: crawl_website
  author: aadithyanr
  label:
    en_US: Crawl Website
description:
  human:
    en_US: Crawl multiple public pages from a website into clean Markdown.
  llm: Crawl a public website from a starting URL. Returns page Markdown and metadata for each visited page. This consumes credits per page.
parameters:
  - name: url
    type: string
    required: true
    form: llm
    label:
      en_US: Starting URL
    human_description:
      en_US: The public HTTP or HTTPS URL where the crawl begins.
    llm_description: The complete public HTTP or HTTPS URL where the crawl should begin.
  - name: max_pages
    type: number
    required: false
    form: form
    default: 10
    min: 1
    max: 100
    label:
      en_US: Maximum Pages
    human_description:
      en_US: Maximum number of pages to crawl. Credits are consumed per page.
  - name: max_depth
    type: number
    required: false
    form: form
    default: 2
    min: 0
    max: 10
    label:
      en_US: Maximum Depth
    human_description:
      en_US: Maximum link depth from the starting page.
  - name: url_regex
    type: string
    required: false
    form: form
    label:
      en_US: URL Pattern
    human_description:
      en_US: Regular expression that crawled URLs must match.
  - name: follow_subdomains
    type: boolean
    required: false
    form: form
    default: false
    label:
      en_US: Follow Subdomains
    human_description:
      en_US: Allow the crawler to visit subdomains.
  - name: use_main_content_only
    type: boolean
    required: false
    form: form
    default: true
    label:
      en_US: Main Content Only
    human_description:
      en_US: Remove navigation, footers, and other peripheral content.
extra:
  python:
    source: tools/crawl_website.py
